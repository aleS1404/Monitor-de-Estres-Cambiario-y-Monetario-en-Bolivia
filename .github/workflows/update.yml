name: Actualizar datos del BCB
on:
  schedule:
    - cron: "0 15 * * 3"   # miércoles 15:00 UTC (11:00 Bolivia): el BCB publica los miércoles
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-pipeline.txt
      - run: python -m bcb_pipeline update      # descarga el último Excel y acumula weekly_daily_long.csv
      - name: Guardar cambios
        run: |
          git config user.name "bcb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/processed
          git diff --cached --quiet || git commit -m "Datos BCB $(date -u +%F)"
          git push
