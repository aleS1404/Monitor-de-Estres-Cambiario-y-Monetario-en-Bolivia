name: Recolector P2P (cada hora)
# Aviso: hace un commit por hora. Si prefieres no llenar el historial, corre el recolector
# en tu computadora: python -m bcb_pipeline collect --loop
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: collect-p2p
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-pipeline.txt
      - run: python -m bcb_pipeline collect --csv-only --csv data/p2p/quotes.csv
      - name: Guardar
        run: |
          git config user.name "bcb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/p2p/quotes.csv
          git diff --cached --quiet || git commit -m "P2P $(date -u +%FT%H:%MZ)"
          git pull --rebase -q && git push
